name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Two pushes close together (two brand releases) must not create their releases at the same time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate the marketplace
        run: claude plugin validate .

      - name: Validate each plugin
        # The marketplace run does not open the skill files of the plugins: validate each plugin folder too.
        run: |
          shopt -s nullglob
          for dir in plugins/*/; do
            echo "::group::$dir"
            claude plugin validate "$dir"
            echo "::endgroup::"
          done

      - name: Check the manifests and build the zips
        run: python3 .github/scripts/package.py --out dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          zips=(dist/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No plugin, no release."
            exit 0
          fi
          # One release per commit: commit date (UTC) and short commit hash, for example 2026.10.07-1a2b3c4.
          tag="$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y.%m.%d)-${GITHUB_SHA::7}"
          if gh release view "$tag" > /dev/null 2>&1; then
            # Re-run of the same commit: replace the files.
            gh release upload "$tag" "${zips[@]}" --clobber
            gh release edit "$tag" --latest --notes-file dist/release-notes.md
          else
            gh release create "$tag" "${zips[@]}" \
              --target "$GITHUB_SHA" \
              --title "Skills $tag" \
              --notes-file dist/release-notes.md \
              --latest
          fi
